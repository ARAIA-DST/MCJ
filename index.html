<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRW Route to Preference</title><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d71f2e"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f4f1;--card:#fff;--tx:#1b1d22;--mu:#6b6f78;--red:#d71f2e;--ln:#e2dfda;--nav:#16181d}
@media(prefers-color-scheme:dark){:root{--bg:#101216;--card:#1a1d23;--tx:#f1efec;--mu:#9a9ea8;--ln:#2a2e36}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Segoe UI",Roboto,sans-serif;padding-bottom:72px}
h1,h2{margin:0 0 12px;font-weight:700}h2{font-size:1.25rem}
main{max-width:760px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;min-height:44px}
input[type=checkbox]{width:auto;min-height:0;margin-right:8px}
button{min-height:44px;padding:0 18px;border:0;border-radius:8px;background:var(--red);color:#fff;font:600 1rem inherit;cursor:pointer;margin-top:14px}
button.s{background:var(--ln);color:var(--tx)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--nav);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;margin:0;border-radius:0;background:none;color:#aaa;font-size:.8rem;min-height:56px}
nav button.on{color:#fff;box-shadow:inset 0 3px 0 var(--red)}
#bar{display:flex;justify-content:space-between;align-items:center;background:var(--nav);color:#fff;padding:10px 16px}
#bar b{color:var(--red)}#st{font-size:.8rem;color:#bbb}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kp div{background:var(--bg);border-radius:8px;padding:12px}.kp b{display:block;font-size:1.6rem}.kp span{color:var(--mu);font-size:.8rem}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9;max-width:90%}
a{color:var(--red);font-weight:600}.v{display:none}.v.on{display:block}
@media(min-width:1024px){body{padding:0 0 0 220px}nav{top:0;bottom:auto;width:220px;flex-direction:column;padding-top:70px}
nav button{flex:none;text-align:left;padding:0 24px;font-size:1rem}nav button.on{box-shadow:inset 4px 0 0 var(--red)}
#bar{margin-left:-220px;padding-left:236px;position:sticky;top:0;z-index:5}main{max-width:980px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
</style></head><body>
<div id="toast"></div>
<div id="bar"><div><b>TRW</b> Route to Preference</div><div id="st"></div></div>
<main id="login"><div class="card"><h2>Masuk</h2>
<label>URL API (Apps Script /exec)</label><input id="api" placeholder="https://script.google.com/macros/s/.../exec">
<label>Username</label><input id="un" autocapitalize="none"><label>PIN</label><input id="pin" type="password" inputmode="numeric">
<button onclick="login()">Masuk</button></div></main>

<main id="app" style="display:none">
<section class="v on" id="v-visit"><div class="card"><h2>Kunjungan</h2>
<label>Outlet / bengkel</label><select id="vo"></select>
<label>Peran</label><select id="vt"><option value="FM">Field Merchandiser (merchandising)</option><option value="SPG">SPG Bengkel</option></select>
<label>Stok TRW & POSM</label><input id="vs" placeholder="mis. Brake pad 12 pcs, POSM lengkap">
<label>Foto planogram (setelah)</label><input id="vp" type="file" accept="image/*" capture="environment">
<label>Catatan</label><textarea id="vn" rows="2"></textarea>
<label><input type="checkbox" id="vx">Kunjungan gagal (butuh persetujuan pengecualian)</label>
<div id="gps" style="color:var(--mu);font-size:.85rem;margin-top:8px">GPS: menunggu…</div>
<button onclick="sendVisit()">Selesai kunjungan</button></div></section>

<section class="v" id="v-survey"><div class="g2"><div class="card"><h2>Survei pelanggan</h2>
<label>Bengkel</label><select class="ol" id="so"></select>
<label>Hal yang paling penting saat memilih suku cadang</label><select id="sd"><option>Harga</option><option>Rekomendasi mekanik</option><option>Merek / kualitas</option><option>Ketersediaan</option></select>
<label>Merek yang dipakai sekarang</label><input id="sb">
<label><input type="checkbox" id="sc">Responden setuju datanya dipakai untuk survei ini</label>
<button onclick="sendSurvey()">Simpan survei</button></div>
<div class="card"><h2>Lead peluang</h2><label>Outlet</label><select class="ol" id="lo"></select>
<label>Kategori</label><select id="lc"><option>Brake pad</option><option>Brake disc</option><option>Shock absorber</option><option>Linkage</option></select>
<label>Kebutuhan</label><input id="ln"><label>Kontak (nama / WA)</label><input id="lk">
<label><input type="checkbox" id="lp">Kontak bersedia dihubungi</label><button onclick="sendLead()">Simpan lead</button></div></div></section>

<section class="v" id="v-loy"><div class="g2"><div class="card"><h2>Daftar pelanggan loyalty</h2>
<label>Nama</label><input id="cn"><label>No. WhatsApp</label><input id="cw" inputmode="tel" placeholder="08123456789">
<label>Plat nomor</label><input id="cp"><label>Bengkel</label><select class="ol" id="co"></select>
<label>Tanggal servis terakhir</label><input id="cl" type="date">
<label><input type="checkbox" id="cc">Pelanggan setuju menerima voucher & pengingat via WhatsApp</label>
<button onclick="sendCust()">Daftarkan</button></div>
<div class="card"><h2>Voucher</h2><label>Pelanggan</label><select id="cs"></select>
<button onclick="issue()">Kirim voucher via WhatsApp</button>
<label style="margin-top:20px">Tukar kode voucher</label><input id="rc" placeholder="TRW-XXXX-XXXX"><button class="s" onclick="redeem()">Tukar</button></div></div>
<div class="card"><h2>Antrean pesan WhatsApp</h2><div id="ob" style="color:var(--mu)">Tidak ada.</div><button class="s" onclick="loadOb()">Muat ulang</button>
<button class="s" onclick="runRem()">Jalankan pengingat sekarang</button></div></section>

<section class="v" id="v-kpi"><div class="card"><h2>Scorecard pilot</h2><div class="kp" id="kp"></div>
<p style="color:var(--mu);font-size:.8rem">Data pilot, bukan jaminan hasil. Penjualan hanya dihitung dengan bukti dari klien.</p>
<button class="s" onclick="loadKpi()">Muat ulang</button></div></section>

<nav id="nav"><button class="on" data-v="visit">Kunjungan</button><button data-v="survey">Survei & Lead</button><button data-v="loy">Loyalty</button><button data-v="kpi">KPI</button><button onclick="logout()">Keluar</button></nav>
</main>
<script>
const $=s=>document.querySelector(s),ls=localStorage;
let S=JSON.parse(ls.S||'{}'),Q=JSON.parse(ls.Q||'[]'),pos={};
const save=()=>{ls.S=JSON.stringify(S);ls.Q=JSON.stringify(Q);st()};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)};
const st=()=>$('#st').textContent=(navigator.onLine?'Online':'Offline')+(Q.length?' · antrean '+Q.length:'');
const post=b=>fetch(S.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}).then(r=>r.json());
async function api(action,payload,queue){
  const b={action,token:S.token,payload,requestId:crypto.randomUUID()};
  try{const j=await post(b);if(!j.ok&&j.error.code==='AUTH')logout();return j}
  catch(e){if(queue){Q.push(b);save();return{ok:true,queued:1}}return{ok:false,error:{message:'Tidak ada jaringan'}}}}
async function flush(){while(Q.length&&navigator.onLine){try{const j=await post(Q[0]);if(!j.ok&&j.error.code==='AUTH')return;Q.shift();save()}catch(e){return}}}
async function login(){S.api=$('#api').value.trim()||S.api;const j=await api('login',{username:$('#un').value,pin:$('#pin').value});
  if(!j.ok)return toast(j.error.message);S.token=j.data.token;S.user=j.data.user;save();boot()}
function logout(){S.token='';save();$('#app').style.display='none';$('#login').style.display='block'}
async function boot(){if(!S.token){$('#api').value=S.api||'';return}
  $('#login').style.display='none';$('#app').style.display='block';
  const j=await api('outlets');if(j.ok){ls.O=JSON.stringify(j.data)}fillOutlets();loadCust();flush();gps()}
function fillOutlets(){const o=JSON.parse(ls.O||'[]'),h=o.length?o.map(x=>`<option value="${x.id}">${x.name} (${x.area})</option>`).join(''):'<option value="">Isi sheet Outlets dulu</option>';
  $('#vo').innerHTML=h;document.querySelectorAll('.ol').forEach(e=>e.innerHTML=h)}
function gps(){navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};$('#gps').textContent=`GPS siap (±${pos.acc} m)`},()=>$('#gps').textContent='GPS tidak aktif: kunjungan akan ditandai',{enableHighAccuracy:true,timeout:15000})}
function shrink(f){return new Promise(r=>{if(!f)return r('');const i=new Image();i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.65))};i.src=URL.createObjectURL(f)})}
async function done(j,ok){toast(j.ok?(j.queued?'Offline: tersimpan di antrean':ok):j.error.message);return j.ok}
async function sendVisit(){gps();const photo=await shrink($('#vp').files[0]);
  if($('#vt').value==='FM'&&!photo&&!$('#vx').checked)return toast('Foto planogram wajib untuk FM');
  const j=await api('visit',{outletId:$('#vo').value,type:$('#vt').value,stock:$('#vs').value,note:$('#vn').value,photo,exception:$('#vx').checked,...pos},true);
  if(await done(j,'Kunjungan tersimpan'+(j.data&&j.data.geoFlag?' (flag GPS: '+j.data.geoFlag+')':''))){$('#vs').value=$('#vn').value='';$('#vp').value=''}}
async function sendSurvey(){const j=await api('survey',{workshopId:$('#so').value,driver:$('#sd').value,brand:$('#sb').value,consent:$('#sc').checked},true);if(await done(j,'Survei tersimpan'))$('#sc').checked=false}
async function sendLead(){const j=await api('lead',{outletId:$('#lo').value,category:$('#lc').value,need:$('#ln').value,contact:$('#lk').value,permission:$('#lp').checked},true);await done(j,'Lead tersimpan')}
async function sendCust(){const j=await api('customer',{name:$('#cn').value,wa:$('#cw').value,plate:$('#cp').value,workshopId:$('#co').value,lastService:$('#cl').value,optIn:$('#cc').checked});if(await done(j,j.ok&&j.data.dup?'Pelanggan sudah terdaftar':'Pelanggan terdaftar'))loadCust()}
async function loadCust(){const j=await api('customers');if(j.ok)$('#cs').innerHTML=j.data.map(c=>`<option value="${c.id}">${c.name} - ${c.plate}</option>`).join('')}
async function issue(){const j=await api('voucherIssue',{customerId:$('#cs').value});if(await done(j,'Voucher '+(j.data||{}).code+' dibuat')){window.open(j.data.link,'_blank')}}
async function redeem(){const j=await api('redeem',{code:$('#rc').value,workshopId:$('#co').value});await done(j,'Voucher berhasil ditukar')}
async function loadOb(){const j=await api('outbox');if(!j.ok)return toast(j.error.message);$('#ob').innerHTML=j.data.length?j.data.map(m=>`<div style="padding:6px 0">${m.kind} · <a href="${m.link}" target="_blank">Kirim WhatsApp</a></div>`).join(''):'Tidak ada.'}
async function runRem(){const j=await api('runReminders');await done(j,'Pengingat diproses: '+JSON.stringify(j.data));loadOb()}
async function loadKpi(){const j=await api('kpi');if(!j.ok)return toast(j.error.message);const d=j.data,m=[['Kunjungan FM',d.fmVisits+' / '+d.fmTarget],['Coverage',d.fmCoverage+'% (min 95%)'],['Outlet unik',d.uniqueOutlets],['Workshop SPG unik',d.uniqueWorkshops+' / 80'],['Survei valid',d.surveysValid+' / '+d.surveyTarget],['Lead',d.leads],['Flag GPS',d.flags],['Voucher terbit / tukar',d.vouchersIssued+' / '+d.vouchersRedeemed]];
  $('#kp').innerHTML=m.map(x=>`<div><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}
$('#nav').addEventListener('click',e=>{const v=e.target.dataset.v;if(!v)return;document.querySelectorAll('.v').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===e.target));if(v==='kpi')loadKpi();if(v==='loy'){loadCust();loadOb()}});
addEventListener('online',()=>{st();flush()});addEventListener('offline',st);st();boot();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
