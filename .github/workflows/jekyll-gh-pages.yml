name: Deploy TRW PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - name: Build project Pages path
        shell: bash
        env:
          VITE_GAS_URL: ${{ vars.GAS_EXEC_URL }}
        run: |
          if [[ "$GITHUB_REPOSITORY" == */*.github.io ]]; then
            export PAGES_BASE="/"
          else
            export PAGES_BASE="/${GITHUB_REPOSITORY#*/}/"
          fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
